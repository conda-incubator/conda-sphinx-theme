[theme]
inherit = pydata_sphinx_theme
stylesheet = css/style.css
sidebars = _templates/sidebar-nav-bs.html

[options]
navbar_center = _templates/navbar_center.html
footer_center = _templates/footer_center.html
favicons = static/favicon.ico
goatcounter_url = ""
zulip_url = ""
# Put the navbar links directly after the logo instead of in a 25% column
navbar_align = left
# Ordered list of conda documentation sites shown in the navbar and on the
# generated projects page. Empty means "use the list shipped with the theme".
projects =
# Generate a page listing every entry in the project list.
projects_page = true
